<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Three.js Square Movement</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    // ---------------------------------------
    // Scene, Camera, Renderer
    // ---------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(
        75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---------------------------------------
    // Square (Plane)
    // ---------------------------------------
    const geometry = new THREE.PlaneGeometry(2, 2);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide });
    const square = new THREE.Mesh(geometry, material);

    square.rotation.x = -Math.PI / 2; // lay flat like a floor
    scene.add(square);

    // ---------------------------------------
    // Lighting (optional)
    // ---------------------------------------
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(2, 5, 3);
    scene.add(light);

    // ---------------------------------------
    // Movement Controls
    // ---------------------------------------
    const keys = {};

    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    let yaw = 0; // left/right rotation
    let pitch = 0; // up/down rotation

    function updateMovement() {
        const speed = 0.1;
        const rotSpeed = 0.02;

        // Rotate camera with arrow keys
        if (keys["ArrowLeft"]) yaw += rotSpeed;
        if (keys["ArrowRight"]) yaw -= rotSpeed;
        if (keys["ArrowUp"]) pitch += rotSpeed;
        if (keys["ArrowDown"]) pitch -= rotSpeed;

        camera.rotation.x = pitch;
        camera.rotation.y = yaw;

        // WASD movement
        const forward = new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );

        const right = new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );

        if (keys["w"] || keys["W"]) camera.position.addScaledVector(forward, speed);
        if (keys["s"] || keys["S"]) camera.position.addScaledVector(forward, -speed);
        if (keys["a"] || keys["A"]) camera.position.addScaledVector(right, -speed);
        if (keys["d"] || keys["D"]) camera.position.addScaledVector(right, speed);
    }

    // ---------------------------------------
    // Animation Loop
    // ---------------------------------------
    function animate() {
        requestAnimationFrame(animate);
        updateMovement();
        renderer.render(scene, camera);
    }

    animate();

    // ---------------------------------------
    // Handle Resize
    // ---------------------------------------
    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
