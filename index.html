<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Three.js 3D Proximity Audio</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #startAudio {
            position: absolute;
            top: 20px; left: 20px;
            padding: 12px 20px;
            background: #ff4444; color: #fff;
            font-size: 18px; border: none;
            cursor: pointer; border-radius: 8px;
        }
    </style>
</head>
<body>

<button id="startAudio">Click to Enable Sound</button>

<script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    // ---------------------------------------
    // Three.js Scene
    // ---------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Ground
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Red cube (sound source)
    const cube = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    cube.position.set(0, 0.5, 0);
    scene.add(cube);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(2, 5, 3);
    scene.add(light);

    // ---------------------------------------
    // Movement
    // ---------------------------------------
    const keys = {};
    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => delete keys[e.key]);

    let yaw = 0, pitch = 0;

    function updateMovement() {
        const speed = 0.1;
        const rotSpeed = 0.02;

        if (keys["ArrowLeft"]) yaw += rotSpeed;
        if (keys["ArrowRight"]) yaw -= rotSpeed;
        if (keys["ArrowUp"]) pitch += rotSpeed;
        if (keys["ArrowDown"]) pitch -= rotSpeed;

        camera.rotation.set(pitch, yaw, 0);

        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

        if (keys["w"] || keys["W"]) camera.position.addScaledVector(forward, speed);
        if (keys["s"] || keys["S"]) camera.position.addScaledVector(forward, -speed);
        if (keys["a"] || keys["A"]) camera.position.addScaledVector(right, -speed);
        if (keys["d"] || keys["D"]) camera.position.addScaledVector(right, speed);
    }

    // ---------------------------------------
    // Web Audio API — 3D positional audio
    // ---------------------------------------
    let audioCtx, gainNode, panner, osc;
    let audioStarted = false;

    let melody = [261.63, 329.63, 392.00, 493.88, 440.00]; // simple scale
    let nextNoteTime = 0;

    function startAudio() {
        audioCtx = new AudioContext();

        // Gain (last stage before output)
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0;
        gainNode.connect(audioCtx.destination);

        // 3D Panner Node
        panner = audioCtx.createPanner();
        panner.panningModel = "HRTF"; // most realistic
        panner.distanceModel = "exponential";
        panner.refDistance = 0.5;      // loudest range
        panner.maxDistance = 30;
        panner.rolloffFactor = 1.8;    // smooth fade
        panner.connect(gainNode);

        // Oscillator (tone)
        osc = audioCtx.createOscillator();
        osc.type = "triangle";
        osc.connect(panner);
        osc.start();

        audioStarted = true;
        document.getElementById("startAudio").style.display = "none";
        nextNoteTime = audioCtx.currentTime;
    }

    document.getElementById("startAudio").onclick = startAudio;

    // Update melody
    function updateMelody() {
        if (!audioStarted) return;

        const now = audioCtx.currentTime;
        if (now >= nextNoteTime) {
            const freq = melody[Math.floor(Math.random() * melody.length)];
            osc.frequency.setValueAtTime(freq, now);
            nextNoteTime = now + 0.35;
        }
    }

    // ---------------------------------------
    // 3D panning + smooth fade
    // ---------------------------------------
    function updateAudioSpatial() {
        if (!audioStarted) return;

        // Set sound source position in WebAudio
        panner.positionX.value = cube.position.x;
        panner.positionY.value = cube.position.y;
        panner.positionZ.value = cube.position.z;

        // Listener follows camera in 3D
        audioCtx.listener.positionX.value = camera.position.x;
        audioCtx.listener.positionY.value = camera.position.y;
        audioCtx.listener.positionZ.value = camera.position.z;

        // Listener orientation (forward vector)
        const forward = new THREE.Vector3(0, 0, -1);
        forward.applyEuler(camera.rotation);

        audioCtx.listener.forwardX.value = forward.x;
        audioCtx.listener.forwardY.value = forward.y;
        audioCtx.listener.forwardZ.value = forward.z;

        // Listener up vector
        audioCtx.listener.upX.value = 0;
        audioCtx.listener.upY.value = 1;
        audioCtx.listener.upZ.value = 0;

        // Smooth fade based on real 3D distance
        const dist = camera.position.distanceTo(cube.position);

        // fade gradually between 0m and 10m
        const maxDist = 12;
        const t = Math.min(dist / maxDist, 1);

        // Smooth exponential fade curve
        const volume = Math.pow(1 - t, 2);

        gainNode.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.1);
    }

    // ---------------------------------------
    // Main loop
    // ---------------------------------------
    function animate() {
        requestAnimationFrame(animate);

        updateMovement();
        updateMelody();
        updateAudioSpatial();

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
