<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floating Circles with Drum Machine</title>
<style>
body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
canvas { display: block; }

#ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }

#miniMap {
    position: absolute; top: 10px; left: 10px;
    width: 200px; height: 200px;
    background: rgba(0,0,0,0.6);
    border: 2px solid #fff;
    pointer-events: none;
}

#startAudio {
    position: absolute; top: 220px; left: 10px;
    padding: 12px 20px;
    background: #ff4444; color: #fff;
    font-size: 18px; border: none;
    cursor: pointer; border-radius: 8px;
    pointer-events: auto;
}

#timer {
    position: absolute; top: 10px; left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    color: #fff;
    pointer-events: none;
}
</style>
</head>
<body>
<div id="ui">
    <div id="miniMap"></div>
    <button id="startAudio">Click to Enable Sound</button>
    <div id="timer">05:00</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

// -----------------------------
// SCENE SETUP
// -----------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0,1.5,15);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// -----------------------------
// FLOOR MESH
// -----------------------------
const floorSize = 60;
const floorSegments = 60;
const floorGeometry = new THREE.PlaneGeometry(floorSize,floorSize,floorSegments,floorSegments);
const floorMaterial = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.5});
const floorWire = new THREE.LineSegments(new THREE.WireframeGeometry(floorGeometry), floorMaterial);
floorWire.rotation.x = -Math.PI/2;
scene.add(floorWire);

// -----------------------------
// LIGHTS
// -----------------------------
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,7);
scene.add(light);

// -----------------------------
// FLOATING CIRCLES
// -----------------------------
const circles = [];
const circlePositions = [
    new THREE.Vector3(-10,1,-10),
    new THREE.Vector3(10,1,-10),
    new THREE.Vector3(-10,1,10),
    new THREE.Vector3(10,1,10)
];
const neonColors = [0xff00ff,0x00ffff,0xffff00,0xff5500];

for(let i=0;i<4;i++){
    const mat = new THREE.MeshStandardMaterial({color:neonColors[i], emissive: neonColors[i], emissiveIntensity:0.6});
    const circle = new THREE.Mesh(new THREE.SphereGeometry(1,32,32), mat);
    circle.position.copy(circlePositions[i]);
    scene.add(circle);
    circles.push({
        mesh:circle,
        targetColor: new THREE.Color(neonColors[i]),
        currentColor: new THREE.Color(neonColors[i])
    });
}

// -----------------------------
// MINI-MAP
// -----------------------------
const miniMap = document.getElementById("miniMap");
const mapCanvas = document.createElement("canvas");
mapCanvas.width = 200;
mapCanvas.height = 200;
miniMap.appendChild(mapCanvas);
const mapCtx = mapCanvas.getContext("2d");

// -----------------------------
// MOVEMENT CONTROLS
// -----------------------------
const keys = {};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>delete keys[e.key]);

let yaw=0,pitch=0;
function updateMovement(){
    const moveSpeed=0.13, rotSpeed=0.02;
    if(keys["ArrowLeft"]) yaw+=rotSpeed;
    if(keys["ArrowRight"]) yaw-=rotSpeed;
    if(keys["ArrowUp"]) pitch+=rotSpeed;
    if(keys["ArrowDown"]) pitch-=rotSpeed;

    camera.rotation.set(pitch,yaw,0);

    const forward = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));

    if(keys["w"]||keys["W"]) camera.position.addScaledVector(forward,moveSpeed);
    if(keys["s"]||keys["S"]) camera.position.addScaledVector(forward,-moveSpeed);
    if(keys["a"]||keys["A"]) camera.position.addScaledVector(right,-moveSpeed);
    if(keys["d"]||keys["D"]) camera.position.addScaledVector(right,moveSpeed);

    if(keys["1"]){ circles[0].mesh.position.copy(camera.position); keys["1"]=false; }
    if(keys["2"]){ circles[1].mesh.position.copy(camera.position); keys["2"]=false; }
    if(keys["3"]){ circles[2].mesh.position.copy(camera.position); keys["3"]=false; }
    if(keys["4"]){ circles[3].mesh.position.copy(camera.position); keys["4"]=false; }
}

// -----------------------------
// AUDIO SETUP
// -----------------------------
let audioCtx;
let audioStarted=false;
const circleAudio=[];
const melody=[261.63,293.66,329.63,392.00,440.00];

function startAudio(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    for(let i=0;i<4;i++){
        const osc = audioCtx.createOscillator();
        osc.type="triangle";
        osc.frequency.value = melody[i % melody.length];

        const gain = audioCtx.createGain();
        gain.gain.value = 0.2; // lower volume

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();

        circleAudio.push({osc, gain});
    }

    audioStarted=true;
    startTimer();
    document.getElementById("startAudio").style.display="none";
}
document.getElementById("startAudio").onclick=startAudio;

// -----------------------------
// TIMER
// -----------------------------
let timeLeft=300; // 5 min
const timerDiv = document.getElementById("timer");
let timerInterval;
function startTimer(){
    timerInterval=setInterval(()=>{
        timeLeft-=1;
        if(timeLeft<=0){
            clearInterval(timerInterval);
            stopAudio();
            timeLeft=0;
        }
        let m=Math.floor(timeLeft/60).toString().padStart(2,"0");
        let s=(timeLeft%60).toString().padStart(2,"0");
        timerDiv.innerText=`${m}:${s}`;
    },1000);
}

function stopAudio(){
    if(audioCtx){
        circleAudio.forEach(c=>c.osc.stop());
    }
}

// -----------------------------
// DRUM MACHINE
// -----------------------------
let drumStarted=false;
const rectangles=[];
function updateDrums(){
    if(!audioStarted) return;
    const elapsed = 300 - timeLeft; 
    if(elapsed>60 && elapsed<180){ // 1-3 minutes
        if(!drumStarted){ drumStarted=true; }
        extrudeFloor();
        addRandomWireRectangle(); // only 1 rectangle per frame
    }
}

function extrudeFloor(){
    const vertex = floorGeometry.attributes.position;
    for(let i=0;i<vertex.count;i++){
        vertex.array[i*3+1] += (Math.random()-0.5)*0.5;
    }
    vertex.needsUpdate=true;
}

function addRandomWireRectangle(){
    const width = Math.random()*6 + 2;
    const height = Math.random()*5 + 0.5;
    const depth = Math.random()*6 + 2;
    const x = (Math.random()-0.5)*floorSize;
    const z = (Math.random()-0.5)*floorSize;
    const geometry = new THREE.BoxGeometry(width,height,depth);
    const material = new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:1});
    const mesh = new THREE.Mesh(geometry,material);
    mesh.rotation.x = Math.random()*Math.PI;
    mesh.rotation.y = Math.random()*Math.PI;
    mesh.rotation.z = Math.random()*Math.PI;
    mesh.position.set(x, Math.random()*5 + height/2, z);
    scene.add(mesh);
    rectangles.push(mesh);
}

// Fade rectangles at 1 minute
function updateRectanglesFade(){
    if(timeLeft<=240){ 
        rectangles.forEach(r=>{
            r.material.opacity -=0.01;
            if(r.material.opacity<0) r.material.opacity=0;
        });
    }
}

// -----------------------------
// FLOATING CIRCLES
// -----------------------------
function updateCircles(){
    const time = performance.now()/1000;
    for(let i=0;i<circles.length;i++){
        const c=circles[i];
        c.mesh.position.y = circlePositions[i].y + Math.sin(time + i)*0.5;
        const vol = circleAudio[i]?.gain?.gain.value || 0;
        c.mesh.scale.setScalar(1 + vol*0.5);
    }
}

// -----------------------------
// MINI-MAP
// -----------------------------
function updateMiniMap(){
    mapCtx.clearRect(0,0,mapCanvas.width,mapCanvas.height);
    const scale=mapCanvas.width/floorSize;
    circles.forEach((c,i)=>{
        mapCtx.fillStyle = `#${neonColors[i].toString(16)}`;
        const x = mapCanvas.width/2 + c.mesh.position.x*scale;
        const y = mapCanvas.height/2 + c.mesh.position.z*scale;
        mapCtx.beginPath();
        mapCtx.arc(x,y,6,0,Math.PI*2);
        mapCtx.fill();
    });
    // User
    mapCtx.fillStyle="#ff0000";
    const ux = mapCanvas.width/2 + camera.position.x*scale;
    const uy = mapCanvas.height/2 + camera.position.z*scale;
    mapCtx.beginPath();
    mapCtx.arc(ux,uy,5,0,Math.PI*2);
    mapCtx.fill();
}

// -----------------------------
// ANIMATION LOOP
// -----------------------------
function animate(){
    requestAnimationFrame(animate);
    updateMovement();
    updateCircles();
    updateMiniMap();
    updateDrums();
    updateRectanglesFade();
    renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
