<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Three.js Proximity Synth Cube</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #startAudio {
            position: absolute;
            top: 20px; left: 20px;
            padding: 12px 20px;
            background: #ff4444; color: #fff;
            font-size: 18px; border: none;
            cursor: pointer; border-radius: 8px;
        }
    </style>
</head>
<body>

<button id="startAudio">Click to Enable Sound</button>

<script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import * as Tone from "https://cdn.jsdelivr.net/npm/tone@next/build/Tone.js";

    // ---------------------------------------
    // Scene Setup
    // ---------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(
        75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---------------------------------------
    // Ground Square
    // ---------------------------------------
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // ---------------------------------------
    // Red Cube (the musical object)
    // ---------------------------------------
    const cube = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    cube.position.set(0, 0.5, 0); // at origin
    scene.add(cube);

    // Light so we can see the cube
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(2, 5, 3);
    scene.add(light);

    // ---------------------------------------
    // Movement Controls
    // ---------------------------------------
    const keys = {};
    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    let yaw = 0;
    let pitch = 0;

    function updateMovement() {
        const speed = 0.1;
        const rotSpeed = 0.02;

        // Look around with arrow keys
        if (keys["ArrowLeft"]) yaw += rotSpeed;
        if (keys["ArrowRight"]) yaw -= rotSpeed;
        if (keys["ArrowUp"]) pitch += rotSpeed;
        if (keys["ArrowDown"]) pitch -= rotSpeed;

        camera.rotation.set(pitch, yaw, 0);

        // WASD motion
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right   = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

        if (keys["w"] || keys["W"]) camera.position.addScaledVector(forward, speed);
        if (keys["s"] || keys["S"]) camera.position.addScaledVector(forward, -speed);
        if (keys["a"] || keys["A"]) camera.position.addScaledVector(right, -speed);
        if (keys["d"] || keys["D"]) camera.position.addScaledVector(right, speed);
    }

    // ---------------------------------------
    // Tone.js Synth Setup
    // ---------------------------------------
    let synthStarted = false;
    let loop;

    async function initSynth() {
        await Tone.start();
        console.log("Audio ready");

        // A simple repeating melody
        const synth = new Tone.Synth({
            oscillator: { type: "triangle" },
            envelope: { attack: 0.1, release: 0.5 }
        }).toDestination();

        const notes = ["C4", "E4", "G4", "B4", "A4", "F4"];

        loop = new Tone.Loop(time => {
            const n = notes[Math.floor(Math.random() * notes.length)];
            synth.triggerAttackRelease(n, "8n", time);
        }, "0.5");

        synthStarted = true;
        document.getElementById("startAudio").style.display = "none";
    }

    document.getElementById("startAudio").onclick = initSynth;

    // ---------------------------------------
    // Proximity Check
    // ---------------------------------------
    function updateAudioProximity() {
        if (!synthStarted) return;

        const distance = camera.position.distanceTo(cube.position);

        if (distance < 3) {
            if (!loop.state || loop.state === "stopped") {
                loop.start();
                Tone.Transport.start();
            }
        } else {
            if (loop.state === "started") {
                loop.stop();
            }
        }
    }

    // ---------------------------------------
    // Main Loop
    // ---------------------------------------
    function animate() {
        requestAnimationFrame(animate);
        updateMovement();
        updateAudioProximity();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
