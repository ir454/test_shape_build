<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Three.js Proximity Synth Cube</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #startAudio {
            position: absolute;
            top: 20px; left: 20px;
            padding: 12px 20px;
            background: #ff4444; color: #fff;
            font-size: 18px; border: none;
            cursor: pointer; border-radius: 8px;
        }
    </style>
</head>
<body>

<button id="startAudio">Click to Enable Sound</button>

<script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    // ---------------------------------------
    // Scene / Camera / Renderer
    // ---------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(
        75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---------------------------------------
    // Ground plane
    // ---------------------------------------
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // ---------------------------------------
    // Red Cube
    // ---------------------------------------
    const cube = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    cube.position.set(0, 0.5, 0);
    scene.add(cube);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(2, 5, 3);
    scene.add(light);

    // ---------------------------------------
    // Player movement
    // ---------------------------------------
    const keys = {};
    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    let yaw = 0;
    let pitch = 0;

    function updateMovement() {
        const speed = 0.1;
        const rotSpeed = 0.02;

        if (keys["ArrowLeft"]) yaw += rotSpeed;
        if (keys["ArrowRight"]) yaw -= rotSpeed;
        if (keys["ArrowUp"]) pitch += rotSpeed;
        if (keys["ArrowDown"]) pitch -= rotSpeed;

        camera.rotation.set(pitch, yaw, 0);

        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right   = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

        if (keys["w"] || keys["W"]) camera.position.addScaledVector(forward, speed);
        if (keys["s"] || keys["S"]) camera.position.addScaledVector(forward, -speed);
        if (keys["a"] || keys["A"]) camera.position.addScaledVector(right, -speed);
        if (keys["d"] || keys["D"]) camera.position.addScaledVector(right, speed);
    }

    // ---------------------------------------
    // Web Audio API Synth
    // ---------------------------------------
    let audioStarted = false;
    let audioCtx, gainNode, osc;
    let melodyNotes = [261.63, 329.63, 392.00, 493.88, 440.00]; // C4 E4 G4 B4 A4
    let nextNoteTime = 0;

    function startAudio() {
        audioCtx = new AudioContext();
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0; // start silent
        gainNode.connect(audioCtx.destination);

        osc = audioCtx.createOscillator();
        osc.type = "triangle";
        osc.connect(gainNode);
        osc.start();

        audioStarted = true;
        document.getElementById("startAudio").style.display = "none";

        nextNoteTime = audioCtx.currentTime;
    }

    document.getElementById("startAudio").onclick = startAudio;

    // Play next note every 0.4 seconds
    function updateMelody() {
        if (!audioStarted) return;

        const now = audioCtx.currentTime;

        if (now >= nextNoteTime) {
            const freq = melodyNotes[Math.floor(Math.random() * melodyNotes.length)];
            osc.frequency.setValueAtTime(freq, now);
            nextNoteTime = now + 0.4;
        }
    }

    // ---------------------------------------
    // Distance-based volume
    // ---------------------------------------
    function updateAudioProximity() {
        if (!audioStarted) return;

        const maxDistance = 5;      // where audio becomes silent
        const minDistance = 1.2;    // loudest

        const dist = camera.position.distanceTo(cube.position);

        // Volume curve (smooth falloff)
        let volume = 0;

        if (dist < maxDistance) {
            volume = 1 - ((dist - minDistance) / (maxDistance - minDistance));
            volume = Math.max(0, Math.min(1, volume));
        }

        gainNode.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.1);
    }

    // ---------------------------------------
    // Main loop
    // ---------------------------------------
    function animate() {
        requestAnimationFrame(animate);

        updateMovement();
        updateMelody();
        updateAudioProximity();

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
