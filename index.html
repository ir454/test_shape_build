<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Musical Circles</title>
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
  #map {
    position:absolute;
    top:10px;
    left:10px;
    width:200px;
    height:200px;
    background:#111;
    border:1px solid #555;
    z-index:10;
  }
  #startAudio {
    position:absolute;
    top:220px;
    left:10px;
    padding:10px 20px;
    background:#ff4444;
    color:#fff;
    font-size:16px;
    border:none;
    cursor:pointer;
    border-radius:6px;
    z-index:10;
  }
  #timer {
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:24px;
    color:#fff;
    font-family:sans-serif;
    z-index:10;
  }
</style>
</head>
<body>
<canvas id="threeCanvas"></canvas>
<div id="map"></div>
<button id="startAudio">Click to Enable Sound</button>
<div id="timer">05:00</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

// -------------------- SCENE SETUP --------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0,1.5,15);

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('threeCanvas'),antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);

// -------------------- LIGHTS --------------------
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,7);
scene.add(light);

// -------------------- FLOOR --------------------
const floorSize = 60;
const floorSegments = 60;
const floorGeometry = new THREE.PlaneGeometry(floorSize,floorSize,floorSegments,floorSegments);
const floorMaterial = new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.5});
const floorWire = new THREE.LineSegments(new THREE.WireframeGeometry(floorGeometry),floorMaterial);
floorWire.rotation.x = -Math.PI/2;
scene.add(floorWire);

// -------------------- CIRCLES --------------------
const neonColors = [0xff00ff,0x00ffff,0xffff00,0xff5500];
const circles = [];
const circlePositions = [
  new THREE.Vector3(-10,1,-10),
  new THREE.Vector3(10,1,-10),
  new THREE.Vector3(-10,1,10),
  new THREE.Vector3(10,1,10)
];
for(let i=0;i<4;i++){
  const mat = new THREE.MeshStandardMaterial({color:neonColors[i],emissive:neonColors[i],emissiveIntensity:0.6});
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1,32,32),mat);
  mesh.position.copy(circlePositions[i]);
  scene.add(mesh);
  circles.push({
    mesh:mesh,
    targetColor:new THREE.Color(neonColors[i]),
    currentColor:new THREE.Color(neonColors[i]),
    baseY:mesh.position.y,
    bobSpeed:0.5+Math.random()*0.5,
    bobPhase:Math.random()*Math.PI*2
  });
}

// -------------------- SEGMENTS ABOVE CIRCLES --------------------
const segments = [];
for(let i=0;i<4;i++){
  const material = new THREE.LineBasicMaterial({color:neonColors[i],linewidth:2});
  const points = [new THREE.Vector3(0,0,0), new THREE.Vector3(0,2,0)];
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const line = new THREE.Line(geometry,material);
  scene.add(line);
  segments.push({line:line,baseHeight:2});
}

// -------------------- MOVEMENT --------------------
const keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>delete keys[e.key]);
let yaw=0,pitch=0;
function updateMovement(){
  const moveSpeed=0.13,rotSpeed=0.02;
  if(keys["ArrowLeft"]) yaw+=rotSpeed;
  if(keys["ArrowRight"]) yaw-=rotSpeed;
  if(keys["ArrowUp"]) pitch+=rotSpeed;
  if(keys["ArrowDown"]) pitch-=rotSpeed;
  camera.rotation.set(pitch,yaw,0);
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  if(keys["w"]||keys["W"]) camera.position.addScaledVector(forward,moveSpeed);
  if(keys["s"]||keys["S"]) camera.position.addScaledVector(forward,-moveSpeed);
  if(keys["a"]||keys["A"]) camera.position.addScaledVector(right,-moveSpeed);
  if(keys["d"]||keys["D"]) camera.position.addScaledVector(right,moveSpeed);
}

// -------------------- AUDIO --------------------
let audioCtx;
let audioStarted=false;
const circleAudio=[]; // one per circle
const melody=[261.63,293.66,329.63,392.00,440.00];
function createImpulseResponse(ctx,duration=1.0,decay=1.0){
  const rate=ctx.sampleRate;
  const length=rate*duration;
  const impulse=ctx.createBuffer(2,length,rate);
  const left=impulse.getChannelData(0);
  const right=impulse.getChannelData(1);
  for(let i=0;i<length;i++){
    const n=(length-i)/length;
    const v=Math.random()*Math.pow(n,decay);
    left[i]=v; right[i]=v;
  }
  return impulse;
}
function startAudio(){
  audioCtx=new AudioContext();
  const reverb=createImpulseResponse(audioCtx);
  for(let i=0;i<4;i++){
    const osc=audioCtx.createOscillator();
    osc.type="triangle";
    const panner=audioCtx.createPanner();
    panner.panningModel="HRTF";
    panner.distanceModel="exponential";
    panner.refDistance=1.0;
    panner.maxDistance=60;
    panner.rolloffFactor=0.8;
    const lowpass=audioCtx.createBiquadFilter();
    lowpass.type="lowpass";
    lowpass.frequency.value=20000;
    const convolver=audioCtx.createConvolver();
    convolver.buffer=reverb;
    const reverbGain=audioCtx.createGain();
    reverbGain.gain.value=0.10;
    const gain=audioCtx.createGain();
    gain.gain.value=0;
    osc.connect(panner); panner.connect(lowpass); lowpass.connect(gain); gain.connect(audioCtx.destination);
    osc.connect(convolver); convolver.connect(reverbGain); reverbGain.connect(audioCtx.destination);
    osc.start();
    circleAudio.push({osc,gain,panner,lowpass,nextNoteTime:audioCtx.currentTime+Math.random()*0.5,currentFreq:0,currentVolume:0});
  }
  audioStarted=true;
  document.getElementById("startAudio").style.display="none";
  startTimer();
}
document.getElementById("startAudio").onclick=startAudio;

// -------------------- TIMER --------------------
let timerSeconds=5*60;
let timerInterval=null;
function startTimer(){
  timerInterval=setInterval(()=>{
    timerSeconds--;
    if(timerSeconds<=0){
      clearInterval(timerInterval);
      stopAudio();
    }
    const min=Math.floor(timerSeconds/60).toString().padStart(2,'0');
    const sec=(timerSeconds%60).toString().padStart(2,'0');
    document.getElementById("timer").innerText=min+":"+sec;
  },1000);
}
function stopAudio(){
  audioStarted=false;
  circleAudio.forEach(c=>c.osc.stop());
}

// -------------------- UPDATE AUDIO --------------------
function updateMelody(){
  if(!audioStarted) return;
  const now=audioCtx.currentTime;
  for(let i=0;i<4;i++){
    const c=circleAudio[i];
    if(now>=c.nextNoteTime){
      const noteIndex=Math.floor(Math.random()*melody.length);
      const freq=melody[noteIndex];
      circles[i].targetColor.setHSL(Math.random(),1,0.5);
      c.osc.frequency.setValueAtTime(freq,now);
      c.nextNoteTime=now+0.35+Math.random()*0.15;
      c.currentFreq=freq;
    }
  }
}
function updateAudioSpatial(){
  if(!audioStarted) return;
  audioCtx.listener.positionX.value=camera.position.x;
  audioCtx.listener.positionY.value=camera.position.y;
  audioCtx.listener.positionZ.value=camera.position.z;
  const forward=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  audioCtx.listener.forwardX.value=forward.x;
  audioCtx.listener.forwardY.value=forward.y;
  audioCtx.listener.forwardZ.value=forward.z;
  audioCtx.listener.upX.value=0;
  audioCtx.listener.upY.value=1;
  audioCtx.listener.upZ.value=0;
  for(let i=0;i<4;i++){
    const src=circleAudio[i];
    const circle=circles[i].mesh;
    src.panner.positionX.value=circle.position.x;
    src.panner.positionY.value=circle.position.y;
    src.panner.positionZ.value=circle.position.z;
    const dist=camera.position.distanceTo(circle.position);
    const maxDist=25;
    const t=Math.min(dist/maxDist,1);
    const volume=Math.pow(1-t,3);
    src.gain.gain.linearRampToValueAtTime(volume,audioCtx.currentTime+0.1);
    src.currentVolume=volume;
    const minCut=600,maxCut=20000;
    const cutoff=minCut+(maxCut-minCut)*Math.pow(1-t,2.2);
    src.lowpass.frequency.linearRampToValueAtTime(cutoff,audioCtx.currentTime+0.1);
  }
}

// -------------------- TELEPORT CIRCLES --------------------
document.addEventListener("keydown",e=>{
  if(["1","2","3","4"].includes(e.key)){
    const idx=parseInt(e.key)-1;
    const c=circles[idx];
    c.mesh.position.set(camera.position.x,c.mesh.position.y,camera.position.z);
    c.baseY=c.mesh.position.y;
  }
});

// -------------------- MINI-MAP --------------------
const mapCanvas=document.createElement("canvas");
mapCanvas.width=200; mapCanvas.height=200;
document.getElementById("map").appendChild(mapCanvas);
const mapCtx=mapCanvas.getContext("2d");
function drawMap(){
  mapCtx.clearRect(0,0,mapCanvas.width,mapCanvas.height);
  // draw circles
  circles.forEach((c,i)=>{
    const x=100+c.mesh.position.x*2;
    const y=100+c.mesh.position.z*2;
    mapCtx.fillStyle="#"+neonColors[i].toString(16).padStart(6,'0');
    mapCtx.beginPath();
    mapCtx.arc(x,y,5,0,Math.PI*2);
    mapCtx.fill();
  });
  // draw player
  const px=100+camera.position.x*2;
  const py=100+camera.position.z*2;
  mapCtx.fillStyle="red";
  mapCtx.beginPath();
  mapCtx.arc(px,py,5,0,Math.PI*2);
  mapCtx.fill();
}

// -------------------- ANIMATION --------------------
function animate(){
  requestAnimationFrame(animate);
  const t=performance.now()/1000;
  updateMovement();
  updateMelody();
  updateAudioSpatial();
  // update circles and segments
  for(let i=0;i<circles.length;i++){
    const c=circles[i];
    // bobbing
    c.mesh.position.y=c.baseY+Math.sin(t*c.bobSpeed+c.bobPhase)*0.5;
    // color
    c.currentColor.lerp(c.targetColor,0.02);
    c.mesh.material.color.copy(c.currentColor);
    c.mesh.material.emissive.copy(c.currentColor);
    // segment above
    const s=segments[i];
    const amplitude=circleAudio[i]?.currentVolume??0;
    const pitch=circleAudio[i]?.currentFreq??261.63;
    const height=1+amplitude*15+(pitch-261.63)/261.63*2;
    s.line.geometry.setFromPoints([
      new THREE.Vector3(c.mesh.position.x,c.mesh.position.y,c.mesh.position.z),
      new THREE.Vector3(c.mesh.position.x,c.mesh.position.y+height,c.mesh.position.z)
    ]);
    s.line.material.color.setHSL((pitch%1000)/1000,1,0.5);
  }
  drawMap();
  renderer.render(scene,camera);
}
animate();

// -------------------- RESIZE --------------------
window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
